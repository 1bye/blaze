name: Cut a Rake fork release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '0.YYYYMMDD.N-rake.N'
        required: true
permissions:
  contents: read
jobs:
  cut:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate version, tag and dispatch the Apple Silicon build
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^0\.[0-9]{8}\.[0-9]+-rake\.[0-9]+$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
          gh workflow run release.yaml --ref "v$VERSION" -f version="$VERSION"
