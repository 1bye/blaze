name: Rake Apple Silicon release
on:
  push:
    tags: ['v0.*-rake.*']
  workflow_dispatch:
    inputs:
      version:
        description: '0.YYYYMMDD.N-rake.N (build artifact only on a branch)'
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Require Apple Silicon
        shell: bash
        run: test "$(uname -m)" = arm64
      - uses: actions/checkout@v7
      - name: Pinned compiler and native-server development libraries
        run: rustup toolchain install "$(cat harness/toolchain)" --profile minimal --component rustc-dev
      - name: Build archive
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          export TC=$(rustup run "$(cat harness/toolchain)" rustc --print sysroot)
          python3 -c 'import json,os; print(json.dumps(dict(version=os.environ["TAG"].removeprefix("v"), out="dist", target_dir="target/rake-dist", toolchain_root=os.environ["TC"])))' > build.json
          python3 rake/build_release.py build.json
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64-apple-darwin
          path: |
            dist/blaze-v*-aarch64-apple-darwin.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
      - name: Publish explicit fork tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/blaze-v*-aarch64-apple-darwin.tar.gz dist/*.sha256 dist/SHA256SUMS --prerelease --title "$GITHUB_REF_NAME" --notes 'Pinned Rake Blaze, Apple Silicon only. See RAKE_FORK.md.'
    permissions:
      contents: write
